name: Testes Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências mínimas dos testes
        run: python -m pip install numpy matplotlib pytest
      - name: Testes
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests
