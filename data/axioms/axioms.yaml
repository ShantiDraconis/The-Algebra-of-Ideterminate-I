    statement: "Hardware registers for I and J with IEEE-754-like specification"
    category: "computation"
    description: |
      Extend floating-point arithmetic to include I and J as first-class values,
      preventing division-by-zero errors and enabling indeterminate calculations.
    specifications:
      - Bit pattern for I-state (e.g., 0b11111111_11111111)
      - J-register for dark sector calculations
      - Operations: I + I = I, I × I = I or J (configurable)
      - Error mode: 0/0 → I (not NaN)
    hardware_design:
      - CPU: Dedicated I/J ALU units
      - GPU: Parallel I-field calculations for physics sims
      - FPU: Extended state machine for indeterminate ops
      - Memory: Tagged I/J values with special caching
      
  - id: CF2
    name: "I/0 Logic Gates"
    statement: "Logic gates accepting I/0 as valid input (not just 1/0)"
    category: "computation"
    description: |
      Three-valued logic: 0, 1, I where I represents indeterminate/quantum state
    truth_tables:
      AND: "I AND 0 = 0, I AND 1 = I, I AND I = I"
      OR:  "I OR 0 = I, I OR 1 = 1, I OR I = I"
      NOT: "NOT I = I (indeterminate remains indeterminate)"
    applications:
      - Quantum circuit simulation
      - Fuzzy logic with true indeterminacy
      - Error-resilient computation
      - Probabilistic algorithm optimization

