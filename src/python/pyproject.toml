[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ialgebra"
version = "0.1.0"
description = "Reference implementation for the Algebra of the Indeterminate (I = 0/0)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "black>=24.0"]

[tool.setuptools.packages.find]
where = ["."]
